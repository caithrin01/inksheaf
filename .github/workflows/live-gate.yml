name: live-preview-gate
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run the deployed four-publication gate
        run: node scripts/test-live-preview.mjs
