name: deploy
# Production release path (Codex audit P0-10). Pushes run checks only. A production release must
# be started manually, PROJECT_STATUS must explicitly allow releases, and the protected
# "production" environment must receive Caithrin's approval before its secrets become available.
# Every release records the SHA, artifact digest, checks and Cloudflare deployment id.
on:
  workflow_dispatch:
    inputs:
      note: { description: "why this release", required: true }
  push:
    branches: [main]
    paths-ignore: ["**.md"]
concurrency: { group: production, cancel-in-progress: false }
permissions: { contents: read, deployments: write }
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Typst renderer tools
        run: |
          curl -sSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst && typst --version
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q poppler-utils python3-pil > /dev/null
          python3 -m pip install --quiet pymupdf
      - run: npm run test:preview:unit
      - run: node scripts/test-signup.mjs && node scripts/test-honesty.mjs
      - run: node scripts/test-typst-fixtures.mjs
      - run: npm run build
      - name: Artifact digest
        id: digest
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | cut -d' ' -f1 > dist.sha256
          echo "sha256=$(cat dist.sha256)" >> "$GITHUB_OUTPUT"
          echo "artifact sha256 $(cat dist.sha256) for commit ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 30
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}

  release-policy:
    # A push never enters the production environment. A manual run fails visibly here when the
    # project is paused/executing, rather than making a missing release look like a green deploy.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Enforce project release status and branch
        env:
          PROJECT_STATUS: ${{ vars.PROJECT_STATUS }}
          RELEASE_NOTE: ${{ inputs.note }}
        run: |
          {
            echo "## Production release policy"
            echo "- requested ref: ${GITHUB_REF}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- project status: ${PROJECT_STATUS:-not-set}"
            echo "- reason: ${RELEASE_NOTE}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production releases must run from main; got $GITHUB_REF"
            exit 1
          fi

          case "$PROJECT_STATUS" in
            release-candidate|live) ;;
            *)
              echo "::error::Production release disabled: PROJECT_STATUS is '${PROJECT_STATUS:-not-set}'. Set it to release-candidate or live before requesting a release."
              exit 1
              ;;
          esac

  release:
    needs: [checks, release-policy]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://inksheaf.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - name: Verify the artifact is the one the checks saw
        run: |
          HAVE=$( (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | cut -d' ' -f1)
          [ "$HAVE" = "${{ needs.checks.outputs.sha256 }}" ] || { echo "artifact digest differs: $HAVE vs ${{ needs.checks.outputs.sha256 }}"; exit 1; }
          echo "artifact digest verified: $HAVE"
      - name: Migrate the production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate.mjs --remote
      - name: Deploy to Cloudflare Pages (production)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUT=$(npx wrangler pages deploy dist --project-name inksheaf --branch main --commit-hash "$GITHUB_SHA" --commit-message "release $GITHUB_SHA" 2>&1); echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-z0-9]+\.inksheaf\.pages\.dev' | tail -1)
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify production serves this release
        run: |
          sleep 20
          for i in 1 2 3 4 5 6; do H=$(curl -s https://inksheaf.com/api/preview?url=caithrin.com -o /dev/null -w '%{http_code}'); [ "$H" = "200" ] && break; sleep 15; done
          curl -s -o /dev/null -w 'inksheaf.com -> %{http_code}\n' https://inksheaf.com/
      - name: Record the release
        run: |
          {
            echo "## Release"; echo "- commit: ${GITHUB_SHA}"; echo "- artifact sha256: ${{ needs.checks.outputs.sha256 }}";
            echo "- checks: unit, signup, honesty, typst fixtures, build (job checks)"; echo "- approved by: ${{ github.actor }} via the production environment";
            echo "- Cloudflare deployment: ${{ steps.deploy.outputs.deployment_url }}"; echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
          } >> "$GITHUB_STEP_SUMMARY"
