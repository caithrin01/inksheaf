name: press
# The press: started by a reservation (event press) or an approval (event list). Builds the
# proof pages or the final files with the same pipeline that made the dogfood book, stores
# them privately, emails the writer, and reports status to the site.
on:
  repository_dispatch:
    types: [press, list, change, invoice, mail]
  workflow_dispatch:
    inputs:
      event: { description: "press or list", default: "press" }
      signup_id: { description: "signups.id", required: true }
      publication_url: { description: "https://...", required: true }
      email: { description: "writer's email", required: true }
concurrency: press-${{ github.event.client_payload.signup_id || inputs.signup_id }}
jobs:
  press:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typst renderer tools (typst binary, poppler for the blank measure, Pillow)
        run: |
          curl -sSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst && typst --version
          sudo apt-get install -y -q poppler-utils python3-pil > /dev/null
      - name: Press
        env:
          INKSHEAF_ENV: production
          BOOK_ENGINE: typst
          PRESS_EVENT: ${{ github.event.client_payload.event || inputs.event }}
          SIGNUP_ID: ${{ github.event.client_payload.signup_id || inputs.signup_id }}
          PUBLICATION_URL: ${{ github.event.client_payload.publication_url || inputs.publication_url }}
          WRITER_EMAIL: ${{ github.event.client_payload.email || inputs.email }}
          PLAN_JSON: ${{ github.event.client_payload.plan_json }}
          VERSION_ID: ${{ github.event.client_payload.version_id }}
          CHANGE_REQUEST: ${{ github.event.client_payload.request }}
          MAILING_ID: ${{ github.event.client_payload.mailing_id }}
          INVOICE_JSON: ${{ toJSON(github.event.client_payload.invoice) }}
          ADDRESSES_JSON: ${{ toJSON(github.event.client_payload.addresses) }}
          FILES_JSON: ${{ github.event.client_payload.files }}
          LEVEL: ${{ github.event.client_payload.level }}
          ARCHIVE_RELAY_TOKEN: ${{ secrets.ARCHIVE_RELAY_TOKEN }}
          PROOF_STORE_TOKEN: ${{ secrets.INKSHEAF_PROOF_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LULU_CLIENT_KEY: ${{ secrets.LULU_CLIENT_KEY }}
          LULU_CLIENT_SECRET: ${{ secrets.LULU_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPERATOR_EMAIL: caithrin@caithrin.com
          SITE_BASE: https://inksheaf.com
        run: node scripts/press.mjs
      - name: Record failure (Codex audit P0-7)
        if: failure()
        env:
          SIGNUP_ID: ${{ github.event.client_payload.signup_id || inputs.signup_id }}
          VERSION_ID: ${{ github.event.client_payload.version_id }}
          ARCHIVE_RELAY_TOKEN: ${{ secrets.ARCHIVE_RELAY_TOKEN }}
          SITE_BASE: https://inksheaf.com
        run: |
          node -e '
            const c=require("crypto"); const id=Number(process.env.SIGNUP_ID); const s=process.env.ARCHIVE_RELAY_TOKEN; if(!id||!s) process.exit(0);
            const sig=c.createHmac("sha256",s).update(`${id}:failed`).digest("hex");
            fetch(process.env.SITE_BASE+"/api/press-status",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({signup_id:id,status:"failed",sig,message:"the press run failed; see the run",run:process.env.GITHUB_RUN_ID,error:"workflow failure",version_id:Number(process.env.VERSION_ID)||undefined,version_status:process.env.VERSION_ID?"failed":undefined})}).then(r=>console.log("failed recorded",r.status)).catch(e=>console.log("could not record",e.message));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: press-${{ github.run_id }}
          path: proofs/press/**/*.json
          if-no-files-found: ignore
